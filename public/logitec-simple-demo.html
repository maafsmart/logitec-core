<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f4c81" />
    <title>LOGITEC Core WMS · Demo operativa</title>
    <link rel="stylesheet" href="/logitec-simple-demo.css?v=4" />
  </head>
  <body>
    <div class="demo-banner" role="status">DEMO · SOLO LECTURA · NO AFECTA INVENTARIO</div>
    <div class="demo-banner excel hidden" id="excelSourceBanner" role="status">FUENTE DEMO: EXCEL OFICIAL · SOLO LECTURA</div>
    <div class="concept-strip" aria-label="Flujo LOGITEC">
      <span><strong>Administrador</strong> configura</span>
      <span class="arrow">→</span>
      <span><strong>Supervisor</strong> organiza</span>
      <span class="arrow">→</span>
      <span><strong>LOGITEC</strong> dirige</span>
      <span class="arrow">→</span>
      <span><strong>Operador</strong> escanea</span>
      <span class="arrow">→</span>
      <span><strong>LOGITEC</strong> registra trazabilidad</span>
    </div>
    <div class="app-shell" id="appShell">
      <aside class="sidebar" id="sidebar" aria-label="Navegación"></aside>
      <div class="workspace">
        <header class="topbar">
          <div class="topbar-main">
            <p class="eyebrow">LOGITEC Core WMS</p>
            <h1 id="viewTitle">Demo operativa</h1>
            <p id="authHint" class="subtle">Conectando…</p>
          </div>
          <div class="role-switch" id="roleSwitch" aria-label="Vista por rol">
            <button type="button" class="role-btn" data-role="admin">Administrador</button>
            <button type="button" class="role-btn" data-role="supervisor">Supervisor</button>
            <button type="button" class="role-btn active" data-role="operator">Operador</button>
          </div>
        </header>
        <main id="app" class="content"></main>
      </div>
    </div>
    <footer class="demo-footer">
      <span id="writeGuard">Escrituras bloqueadas: 0</span>
      <span id="dataSource">Fuente: sin datos</span>
    </footer>
    <script src="/logitec-simple-demo.js?v=4" defer></script>
  </body>
</html>
