<!doctype html>
<html lang="es" data-canonical-host-version="www-v1">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/canonical-host.js?v=1"></script>
    <title>Logitec | Iniciar sesion</title>
    <style>
      :root {
        --bg: #0c1219;
        --panel: #141c26;
        --line: #2a3644;
        --text: #e8edf2;
        --muted: #8a97a6;
        --accent: #3d7ab0;
        --danger: #d96b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        background: radial-gradient(circle at top, #1a2a3a 0%, var(--bg) 55%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(420px, 100%);
        background: rgba(16, 26, 51, 0.95);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      }
      h1 { margin: 0 0 8px; font-size: 1.45rem; }
      p { margin: 0 0 24px; color: var(--muted); }
      label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 0.92rem;
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #0f1830;
        color: var(--text);
        padding: 12px;
        margin-bottom: 16px;
      }
      input:focus {
        outline: 2px solid #426ec5;
        border-color: #426ec5;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 12px;
        font-weight: 600;
        cursor: pointer;
        color: white;
        background: linear-gradient(90deg, var(--accent), #5a8fb8);
      }
      button:disabled { opacity: 0.7; cursor: wait; }
      .remember-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .remember-options {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        min-width: 0;
      }
      .remember-row label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        color: var(--text);
        cursor: pointer;
      }
      .remember-row input {
        width: auto;
        margin: 0;
      }
      .remember-row button {
        width: auto;
        padding: 6px 10px;
        font-size: 0.8rem;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Portal Logitec</h1>
      <p>Inicia sesion para acceder al panel operativo.</p>
      <form id="loginForm" method="post" action="/api/auth/login" autocomplete="on">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />

        <label for="password">Contrasena</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <div class="remember-row">
          <div class="remember-options">
            <label for="rememberEmail">
              <input id="rememberEmail" type="checkbox" />
              Recordar correo
            </label>
            <label for="rememberPassword" id="rememberPasswordRow" hidden>
              <input id="rememberPassword" type="checkbox" />
              Recordar contraseña en este navegador
            </label>
          </div>
          <button type="button" id="clearRememberedEmailBtn">Usar otra cuenta</button>
        </div>

        <div id="errorMessage" class="error"></div>
        <button id="submitBtn" type="submit">Iniciar sesion</button>
      </form>
    </main>

    <script src="/login.js?v=4"></script>
  </body>
</html>
