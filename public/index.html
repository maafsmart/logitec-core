<!doctype html>
<html lang="es" data-canonical-host-version="www-v1">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/canonical-host.js?v=1"></script>
    <title>Logitec | Inicializando</title>
    <style>
      :root {
        --bg: #0b1222;
        --panel: #111c34;
        --line: #2a3b63;
        --text: #eaf0ff;
        --muted: #9caacc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, #12244a 0%, var(--bg) 55%);
      }
      .card {
        width: min(480px, 100%);
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(17, 28, 52, 0.95);
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 14px;
        color: var(--muted);
      }
      .loader {
        height: 8px;
        width: 100%;
        border-radius: 999px;
        overflow: hidden;
        background: #1a2950;
      }
      .loader > span {
        display: block;
        height: 100%;
        width: 32%;
        background: #76a7ff;
        animation: move 1.2s ease-in-out infinite;
      }
      .status {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.92rem;
      }
      @keyframes move {
        0% { transform: translateX(-130%); }
        100% { transform: translateX(360%); }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Logitec WMS</h1>
      <p>Despertando servicio y validando sesion...</p>
      <div class="loader"><span></span></div>
      <div id="statusText" class="status">Conectando con API...</div>
    </main>
    <script src="/boot.js?v=4"></script>
  </body>
</html>
